services:
  clientemqtt:
    image: clientemqtt
    container_name: clientemqtt
    environment:
      - TZ=America/Argentina/Buenos_Aires 
      - SERVIDOR=${SERVIDOR} #Se reemplazará por la env var SERVIDOR defineda en .env
      - TOPICO1=${TOPICO1}
      - TOPICO2=${TOPICO2}
      - TOPICO_PUB=${TOPICO_PUB}
    restart: unless-stopped